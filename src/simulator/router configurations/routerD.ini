[metadata]
HOST = 127.0.0.1
PORT = 60004

[host]
virtual_address = 4
bandwidth = 1000
buffer_size=500

[routing]
neighbors = 2
    3
    5

; List of each possible known destination.
destinations = 5
    0

; List of each local forward to take when travelling to destination of same index.
local_forwarding = 5
    3

; The time, in milliseconds, that packet forwarding should be delayed by to simulate propagation delay.
; Each value corresponds to to a value in neighbors
delays = 50
    70
    15

[loss]
loss_chance = 0.0